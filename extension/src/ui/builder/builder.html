<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Element Finder Studio — Builder</title>
  <link rel="stylesheet" href="builder.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span data-icon="brand" data-icon-size="18"></span> <strong>Element Finder Studio</strong></div>
    <div class="project-info">
      <input id="project-name" class="project-name" placeholder="Untitled project" spellcheck="false">
      <span id="project-meta" class="project-meta"></span>
    </div>
    <div class="toolbar">
      <button id="btn-undo" data-i18n-title="builder.undoTitle" title="Undo (Ctrl+Z)" disabled><span data-icon="undo"></span></button>
      <button id="btn-redo" data-i18n-title="builder.redoTitle" title="Redo (Ctrl+Y)" disabled><span data-icon="redo"></span></button>
      <span class="sep"></span>
      <div class="device-switch" role="group" aria-label="Preview device">
        <button data-device="desktop" class="active" data-i18n-title="builder.desktop" title="Desktop"><span data-icon="desktop"></span></button>
        <button data-device="tablet" data-i18n-title="builder.tablet" title="Tablet ≤1024px"><span data-icon="tablet"></span></button>
        <button data-device="mobile" data-i18n-title="builder.mobile" title="Mobile ≤767px"><span data-icon="mobile"></span></button>
      </div>
      <span class="sep"></span>
      <button id="btn-validate"><span data-icon="validate"></span><span data-i18n="builder.validate">Validate</span></button>
      <button id="btn-save"><span data-icon="save"></span><span data-i18n="builder.save">Save</span></button>
      <button id="btn-version" data-i18n-title="builder.versionTitle" title="Freeze current state as a version"><span data-icon="version"></span><span data-i18n="builder.version">Version</span></button>
      <button id="btn-projects"><span data-icon="projects"></span><span data-i18n="builder.projects">Projects</span></button>
      <button id="btn-export" class="primary"><span data-icon="export"></span><span data-i18n="builder.export">Export</span></button>
      <span class="sep"></span>
      <button id="btn-lang" data-i18n-title="builder.langToggleTitle" title="Switch language / تغییر زبان">فا</button>
    </div>
  </header>

  <main class="workspace">
    <aside class="pane pane-tree">
      <div class="pane-head">
        <span data-i18n="builder.structure">Structure</span>
        <span id="tree-count" class="badge"></span>
      </div>
      <div id="tree" class="tree" tabindex="0"></div>
    </aside>

    <section class="pane pane-preview">
      <div class="pane-head">
        <span data-i18n="builder.preview">Preview</span>
        <span id="preview-size" class="badge"></span>
      </div>
      <div class="preview-stage">
        <iframe id="preview" title="Reconstruction preview" src="preview.html"></iframe>
      </div>
      <div id="validation-panel" class="validation-panel hidden"></div>
    </section>

    <aside class="pane pane-inspector">
      <div class="pane-head"><span data-i18n="builder.inspector">Inspector</span></div>
      <div id="inspector" class="inspector">
        <p class="empty" data-i18n="insp.selectPrompt">Select an element in the tree or preview.</p>
      </div>
    </aside>
  </main>

  <dialog id="export-dialog" class="dialog"></dialog>
  <dialog id="projects-dialog" class="dialog"></dialog>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="builder.js"></script>
</body>
</html>
