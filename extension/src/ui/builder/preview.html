<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Dodge hotlink protection: never send a referrer for previewed assets. -->
  <meta name="referrer" content="no-referrer">
  <style id="ef-base"></style>
  <style id="ef-page"></style>
</head>
<body>
  <!--
    Preview host. The builder's PreviewPane injects the reconstructed markup
    and stylesheet directly via contentDocument (same extension origin).
    No inline scripts: MV3 extension CSP (script-src 'self') forbids them,
    which is exactly why the previous srcdoc approach broke.
  -->
</body>
</html>
